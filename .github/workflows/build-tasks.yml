name: Build Tasks APK

on:
  push:
    branches: [main, master]
    paths:
      - 'tasks-circle/**'
      - '.github/workflows/build-tasks.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tasks-circle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: tasks-circle/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Tasks.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasks-apk
          path: tasks-circle/Tasks.apk
